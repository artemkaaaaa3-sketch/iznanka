<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не&nbsp;найдена&nbsp;— Изнанка</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231E1E21'/%3E%3Cpath d='M7 5v22M25 5v22' stroke='%23F7F7F4' stroke-width='2' stroke-dasharray='2 3'/%3E%3Cpath d='M16 9v14' stroke='%23F7F7F4' stroke-width='4'/%3E%3C/svg%3E">
<style>
/* Пути от корня: Netlify отдаёт эту страницу на любом несуществующем адресе,
   и с /uslugi/staroe относительный путь «fonts/…» ушёл бы в /uslugi/fonts/ */
@font-face{font-family:"Science Gothic";src:url("/iznanka/fonts/science-gothic.woff2") format("woff2");font-weight:350 650;font-stretch:55% 175%;font-style:normal;font-display:swap}
@font-face{font-family:"Ysabeau Office";src:url("/iznanka/fonts/ysabeau-office.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
:root{
  --flannel:#E4E4E0;--chalk:#F7F7F4;--wool:#1E1E21;--lining:#2B3BF0;
  --display:"Science Gothic","Arial Narrow",Arial,sans-serif;
  --text:"Ysabeau Office","Segoe UI",system-ui,sans-serif;
  --pad:clamp(20px,4vw,40px);--r:3px;--t-text:17px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--flannel);color:var(--wool);font:400 var(--t-text)/1.45 var(--text);-webkit-font-smoothing:antialiased}
h1,p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--lining);outline-offset:3px}
.wrap{width:100%;max-width:calc(760px + var(--pad) * 2);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.top{padding-top:clamp(20px,4vw,40px)}

/* логотип как на главной: тканый ярлык, при наведении видна его изнанка */
.logo{display:inline-grid;align-items:center;min-height:44px;perspective:600px;text-decoration:none}
.logo__face,.logo__back{grid-area:1/1;display:block;padding:10px 18px 9px;border-radius:var(--r);font-family:var(--display);font-weight:600;font-size:13px;line-height:1;font-stretch:125%;letter-spacing:.26em;text-transform:uppercase;-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:transform .7s cubic-bezier(.3,.7,.2,1);background-repeat:no-repeat;background-size:1px calc(100% - 8px),1px calc(100% - 8px);background-position:6px 4px,calc(100% - 6px) 4px}
.logo__face{background-color:var(--wool);color:var(--chalk);background-image:repeating-linear-gradient(180deg,var(--chalk) 0 2px,transparent 2px 5px),repeating-linear-gradient(180deg,var(--chalk) 0 2px,transparent 2px 5px)}
.logo__back{background-color:var(--chalk);color:var(--wool);transform:rotateY(180deg);background-image:repeating-linear-gradient(180deg,var(--wool) 0 2px,transparent 2px 5px),repeating-linear-gradient(180deg,var(--wool) 0 2px,transparent 2px 5px)}
.logo__back span{display:inline-block;transform:scaleX(-1)}
@media (hover:hover){.logo:hover .logo__face{transform:rotateY(-180deg)}.logo:hover .logo__back{transform:rotateY(0deg)}}

.main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-top:clamp(48px,8vw,96px);padding-bottom:clamp(72px,12vw,160px)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,96px);line-height:.9;font-stretch:62%;font-variation-settings:"CTRS" 80;letter-spacing:-.01em}
.main p{max-width:36em;margin-top:24px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;margin-top:32px}

/* кнопка и ссылка как на главной: при наведении на кнопке проступает строчка */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:10px 26px;border:0;border-radius:var(--r);background:var(--lining);color:var(--chalk);font-family:var(--text);font-weight:700;font-size:var(--t-text);line-height:1.2;letter-spacing:.01em;text-align:center;text-decoration:none;cursor:pointer;transition:background-color .2s ease,color .2s ease}
.btn::after{content:"";position:absolute;inset:5px;border:1px dashed currentColor;border-radius:2px;opacity:0;transition:opacity .2s ease;pointer-events:none}
.btn:hover{background:var(--wool);color:var(--chalk)}
.btn:hover::after{opacity:.6}
.link{display:inline-flex;align-items:center;min-height:44px;font-family:var(--text);font-weight:600;font-size:var(--t-text);line-height:1.2;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:6px}
.link:hover{color:var(--lining)}

@media (max-width:767px){:root{--t-text:16px}}
@media (prefers-reduced-motion:reduce){.logo__face,.logo__back,.btn,.btn::after{transition:none}}
</style>
</head>
<body>
<header class="top wrap">
  <a class="logo" href="/iznanka/" aria-label="Изнанка&nbsp;— на&nbsp;главную">
    <span class="logo__face" aria-hidden="true">Изнанка</span>
    <span class="logo__back" aria-hidden="true"><span>Изнанка</span></span>
  </a>
</header>
<main class="main wrap">
  <h1>Шов&nbsp;разошёлся</h1>
  <p>Такой страницы нет: ссылка устарела или&nbsp;в&nbsp;адресе опечатка. Разбор гардероба, шопинг и&nbsp;съёмка&nbsp;— на&nbsp;главной.</p>
  <div class="acts">
    <a class="btn" href="/iznanka/">На&nbsp;главную</a>
    <a class="link" href="/iznanka/#zapis">Сразу к&nbsp;записи</a>
  </div>
</main>
</body>
</html>
